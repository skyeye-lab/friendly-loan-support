<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Friendly Loan Support | Low interest, fast disbursement</title>
  <!-- Font Awesome for icons (optional but adds friendliness) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
    }

    body {
      background: linear-gradient(145deg, #f9f7fe 0%, #eef3fd 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    /* main card */
    .loan-card {
      max-width: 780px;
      width: 100%;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 48px;
      box-shadow: 0 25px 50px -12px rgba(0, 45, 80, 0.25), 0 10px 20px -6px rgba(0, 0, 0, 0.05);
      padding: 2.5rem 2.2rem;
      border: 1px solid rgba(255, 255, 255, 0.7);
      transition: transform 0.2s ease;
    }

    /* header / brand */
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 1.8rem;
    }

    .brand-icon {
      background: #2563eb;
      color: white;
      width: 52px;
      height: 52px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      box-shadow: 0 10px 18px -6px rgba(37, 99, 235, 0.4);
    }

    .brand h1 {
      font-size: 1.9rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #0a2540;
      line-height: 1.2;
    }

    .brand h1 span {
      color: #2563eb;
      font-weight: 800;
    }

    .tagline {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem 2rem;
      margin: 1.5rem 0 2rem 0;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid #dce7f5;
    }

    .tagline-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1rem;
      font-weight: 500;
      color: #1e3a5f;
    }

    .tagline-item i {
      color: #2563eb;
      font-size: 1.2rem;
      width: 1.6rem;
      text-align: center;
    }

    /* slider area */
    .slider-section {
      background: #ffffff;
      border-radius: 32px;
      padding: 1.6rem 1.8rem 1.8rem 1.8rem;
      box-shadow: 0 6px 20px rgba(0, 20, 60, 0.04);
      border: 1px solid #e7eef9;
    }

    .slider-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 0.75rem;
    }

    .slider-header label {
      font-weight: 600;
      color: #163a5f;
      letter-spacing: -0.01em;
      font-size: 1.1rem;
    }

    .amount-badge {
      background: #e4edfe;
      color: #1d4ed8;
      font-weight: 700;
      padding: 0.5rem 1.2rem;
      border-radius: 100px;
      font-size: 1.3rem;
      letter-spacing: -0.3px;
    }

    .slider-wrapper {
      margin: 1rem 0 1.2rem 0;
      padding: 0 0.25rem;
    }

    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      height: 8px;
      background: #dbe7fd;
      border-radius: 20px;
      outline: none;
      cursor: pointer;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 28px;
      height: 28px;
      background: #2563eb;
      border-radius: 50%;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.5);
      border: 3px solid white;
      transition: 0.1s;
      cursor: grab;
    }

    input[type=range]::-webkit-slider-thumb:hover {
      transform: scale(1.1);
      background: #1d4ed8;
    }

    input[type=range]::-moz-range-thumb {
      width: 28px;
      height: 28px;
      background: #2563eb;
      border-radius: 50%;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.5);
      border: 3px solid white;
      cursor: grab;
    }

    .slider-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      color: #4a6e9e;
      font-weight: 500;
      margin-top: 6px;
    }

    /* interest & total card */
    .calc-result {
      background: #f2f7ff;
      border-radius: 28px;
      padding: 1.5rem 1.8rem;
      margin-top: 1.8rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      border: 1px solid #d8e5fd;
    }

    .rate-info {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .rate-info .label {
      font-size: 0.9rem;
      font-weight: 600;
      color: #3f5e83;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .rate-info .rate-value {
      font-size: 2rem;
      font-weight: 800;
      color: #0a2540;
      line-height: 1.2;
    }

    .rate-info .rate-value small {
      font-size: 1rem;
      font-weight: 500;
      color: #2563eb;
      margin-left: 4px;
    }

    .total-box {
      text-align: right;
    }

    .total-box .label {
      font-size: 0.9rem;
      font-weight: 600;
      color: #3f5e83;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .total-box .total-amount {
      font-size: 2.4rem;
      font-weight: 800;
      color: #0a2540;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }

    .total-box .interest-note {
      font-size: 0.9rem;
      color: #4e6d92;
      margin-top: 4px;
      font-weight: 500;
    }

    .interest-note i {
      color: #2563eb;
      margin-right: 4px;
    }

    /* trust features */
    .trust-badges {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 1rem;
      margin: 2rem 0 0.5rem 0;
      padding-top: 1rem;
      border-top: 1px solid #dbe7f5;
    }

    .badge-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.95rem;
      font-weight: 500;
      color: #1a3b5e;
    }

    .badge-item i {
      color: #2563eb;
      font-size: 1.2rem;
    }

    /* CTA */
    .cta-button {
      width: 100%;
      margin-top: 1.8rem;
      background: #2563eb;
      border: none;
      padding: 1.1rem 1.5rem;
      border-radius: 50px;
      font-size: 1.2rem;
      font-weight: 700;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      box-shadow: 0 18px 30px -12px rgba(37, 99, 235, 0.5);
      transition: all 0.2s ease;
      letter-spacing: -0.2px;
    }

    .cta-button i {
      font-size: 1.2rem;
      transition: transform 0.2s;
    }

    .cta-button:hover {
      background: #1d4ed8;
      box-shadow: 0 22px 35px -12px #1e4fbb;
      transform: translateY(-2px);
    }

    .cta-button:active {
      transform: translateY(2px);
      box-shadow: 0 10px 20px -8px #1d4ed8;
    }

    .cta-button:hover i {
      transform: translateX(4px);
    }

    .footnote {
      text-align: center;
      font-size: 0.85rem;
      color: #5b799b;
      margin-top: 1rem;
    }

    /* responsive */
    @media (max-width: 600px) {
      .loan-card {
        padding: 1.8rem 1.2rem;
        border-radius: 36px;
      }

      .brand h1 {
        font-size: 1.5rem;
      }

      .brand-icon {
        width: 44px;
        height: 44px;
        font-size: 22px;
      }

      .tagline {
        gap: 1rem;
      }

      .tagline-item {
        font-size: 0.9rem;
      }

      .calc-result {
        flex-direction: column;
        align-items: flex-start;
        gap: 1rem;
      }

      .total-box {
        text-align: left;
        width: 100%;
      }

      .total-box .total-amount {
        font-size: 2rem;
      }

      .rate-info .rate-value {
        font-size: 1.8rem;
      }
    }

    @media (max-width: 420px) {
      .tagline {
        flex-direction: column;
        gap: 0.6rem;
      }

      .slider-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.4rem;
      }

      .amount-badge {
        align-self: flex-end;
      }
    }
  </style>
</head>
<body>
  <div class="loan-card">
    <!-- Brand & Header -->
    <div class="brand">
      <div class="brand-icon">
        <i class="fas fa-hand-holding-heart"></i>
      </div>
      <h1>Friendly <span>Loan Support</span></h1>
    </div>

    <!-- Key selling points (as requested) -->
    <div class="tagline">
      <div class="tagline-item"><i class="fas fa-percent"></i> Low interest rates</div>
      <div class="tagline-item"><i class="fas fa-bolt"></i> Faster disbursements</div>
      <div class="tagline-item"><i class="fas fa-shield-alt"></i> Reliable</div>
    </div>

    <!-- Loan slider + calculation -->
    <div class="slider-section">
      <div class="slider-header">
        <label for="loanSlider">Loan amount</label>
        <div class="amount-badge" id="loanAmountDisplay">$5,000</div>
      </div>

      <div class="slider-wrapper">
        <input type="range" id="loanSlider" min="100" max="10000" value="5000" step="100">
      </div>

      <div class="slider-labels">
        <span>$100</span>
        <span>$10,000</span>
      </div>

      <!-- Interest and total display -->
      <div class="calc-result">
        <div class="rate-info">
          <div class="label">Interest rate</div>
          <div class="rate-value">6% <small>fixed</small></div>
        </div>
        <div class="total-box">
          <div class="label">Total repayment</div>
          <div class="total-amount" id="totalRepayment">$5,300</div>
          <div class="interest-note"><i class="fas fa-coins"></i> <span id="interestAmount">$300</span> interest</div>
        </div>
      </div>
    </div>

    <!-- Trust badges (reliable, low rates, fast) repeated for reinforcement -->
    <div class="trust-badges">
      <div class="badge-item"><i class="fas fa-check-circle"></i> No hidden fees</div>
      <div class="badge-item"><i class="fas fa-clock"></i> 24h approval</div>
      <div class="badge-item"><i class="fas fa-star"></i> Trusted by 12k+</div>
    </div>

    <!-- Call to action (simulated) -->
    <button class="cta-button" id="applyButton">
      <i class="fas fa-paper-plane"></i> Apply now – it’s friendly
    </button>
    <div class="footnote">
      *Sample calculation at 6% flat interest. Final terms may vary.
    </div>
  </div>

  <script>
    (function() {
      // DOM elements
      const slider = document.getElementById('loanSlider');
      const loanAmountDisplay = document.getElementById('loanAmountDisplay');
      const totalRepaymentEl = document.getElementById('totalRepayment');
      const interestAmountEl = document.getElementById('interestAmount');
      const applyButton = document.getElementById('applyButton');

      // Fixed interest rate 6%
      const INTEREST_RATE = 0.06;

      // Format as USD currency without decimals (since slider steps are 100)
      function formatCurrency(amount) {
        return '$' + amount.toLocaleString('en-US', { maximumFractionDigits: 0 });
      }

      // Update all display values based on slider
      function updateLoanCalculation() {
        // Get current loan amount (integer)
        const principal = parseInt(slider.value, 10);

        // Calculate interest (6% flat)
        const interest = principal * INTEREST_RATE;

        // Total repayment
        const total = principal + interest;

        // Update UI
        loanAmountDisplay.textContent = formatCurrency(principal);
        totalRepaymentEl.textContent = formatCurrency(total);
        interestAmountEl.textContent = formatCurrency(interest);
      }

      // Initialize on page load
      updateLoanCalculation();

      // Add event listener for slider changes
      slider.addEventListener('input', updateLoanCalculation);

      // Friendly click feedback for Apply button (demo purpose)
      applyButton.addEventListener('click', function(e) {
        e.preventDefault();
        const principal = parseInt(slider.value, 10);
        const total = principal * 1.06;
        // Simple friendly alert (for demonstration)
        alert(`✅ Friendly Loan Support\n\nLoan amount: ${formatCurrency(principal)}\nTotal repayment (6% interest): ${formatCurrency(total)}\n\nLow rates · Fast disbursement · Reliable\n\nOur team will contact you shortly!`);
      });

      // Bonus: dynamic slider background fill effect (optional, for better UX)
      // This updates the background gradient to show filled portion (WebKit only, but fine)
      function updateSliderTrack() {
        const min = parseFloat(slider.min);
        const max = parseFloat(slider.max);
        const val = parseFloat(slider.value);
        const percent = ((val - min) / (max - min)) * 100;

        // For WebKit/Blink
        slider.style.background = `linear-gradient(to right, #2563eb 0%, #2563eb ${percent}%, #dbe7fd ${percent}%, #dbe7fd 100%)`;
        // For Firefox, we can't easily change track background via style, but thumb remains fine.
        // Add a fallback background color for older browsers
        if (navigator.userAgent.indexOf('Firefox') !== -1) {
          slider.style.background = '#dbe7fd'; // reset for Firefox, but thumb still shows progress.
          // (Firefox doesn't support gradient track without extra styling)
        }
      }

      // Call it initially and on input
      updateSliderTrack();
      slider.addEventListener('input', updateSliderTrack);

      // Also update slider track if window resizes (just in case)
      window.addEventListener('resize', updateSliderTrack);
    })();
  </script>

  <!-- small note: for Firefox, the track gradient won't work but the design remains friendly. -->
</body>
</html>
